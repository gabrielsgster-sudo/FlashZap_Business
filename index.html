<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>FlashZap Business</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho com faixa de obra, filtros, e um treemap em 3 níveis (categoria > serviço > contato) que ocupa a tela */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#141A22; --mut:#5A6571; --line:#D2D8DF;
  --ac:#F2B705; --ac-ink:#141A22; --focus:#1D5BD6; --danger:#B3261E; --ok:#1E7A46;
  --stripe-dark:#141A22; --shadow:0 10px 34px rgba(20,26,34,.22);
  --bsub:#7A5700; --fs:34%; --fl:88%; --ss:38%; --sl:94%; --ts:42%; --tl:98%; --txs:55%; --txl:16%;
  --font-d:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1319; --surface:#171C24; --ink:#E8ECF1; --mut:#97A2AF; --line:#2B333E;
    --ac:#F2B705; --ac-ink:#141A22; --focus:#6EA0FF; --danger:#FF8A80; --ok:#6FD39A;
    --stripe-dark:#0A0D11; --shadow:0 10px 34px rgba(0,0,0,.55);
    --bsub:var(--ac); --fs:22%; --fl:18%; --ss:20%; --sl:16%; --ts:20%; --tl:23%; --txs:35%; --txl:94%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1319; --surface:#171C24; --ink:#E8ECF1; --mut:#97A2AF; --line:#2B333E;
  --ac:#F2B705; --ac-ink:#141A22; --focus:#6EA0FF; --danger:#FF8A80; --ok:#6FD39A;
  --stripe-dark:#0A0D11; --shadow:0 10px 34px rgba(0,0,0,.55);
  --bsub:var(--ac); --fs:22%; --fl:18%; --ss:20%; --sl:16%; --ts:20%; --tl:23%; --txs:35%; --txl:94%;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font:400 15px/1.4 var(--font-b);color:var(--ink);background:var(--bg);
  padding-block:12px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.mut{color:var(--mut)}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{margin:0;font:700 32px/1 var(--font-d);text-transform:uppercase;letter-spacing:.05em}
.sub{display:block;margin-top:4px;color:var(--mut);font-size:13px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stripe{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ac) 0%,color-mix(in srgb,var(--ac) 35%,transparent) 45%,transparent 100%)}
.bsub{display:block;margin-top:3px;font:600 13px/1 var(--font-b);letter-spacing:.32em;text-transform:uppercase;color:var(--bsub)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font-weight:600}
.btn.primary:hover{filter:brightness(.95)}
.btn.wa{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.icon{padding:0;width:40px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut)}
#syncChip[data-s="synced"] .dot{background:var(--ok)}
#syncChip[data-s="saving"] .dot{background:var(--ac)}
#syncChip[data-s="erro"] .dot{background:var(--danger)}

#banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--mut);border-radius:6px;font-size:14px}

.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools input,.tools select,.field input,.field select,.li input{height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;font-size:16px;min-width:0}
.tools #q{flex:2 1 230px}
.tools select{flex:1 1 150px}

.acc{display:flex;flex-direction:column;gap:8px}
.ac{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.ac-h{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 14px 0 0;border:0;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.ac-h .bar{align-self:stretch;width:8px;flex:none;background:hsl(var(--h) 62% 52%)}
.ac-h .nm{flex:1;min-width:0;font:600 19px/1.1 var(--font-d);text-transform:uppercase;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-h em{font:600 13px/1 var(--font-b);font-style:normal;padding:5px 10px;border-radius:999px;background:hsl(var(--h) var(--fs) var(--fl));color:hsl(var(--h) var(--txs) var(--txl))}
.ac-h svg{flex:none}
.ac.open .ac-h{background:hsl(var(--h) var(--fs) var(--fl));color:hsl(var(--h) var(--txs) var(--txl))}
.ac.open .ac-h em{background:hsl(var(--h) var(--ss) var(--sl))}
.ac.open .ac-h svg{transform:rotate(180deg)}
.ac-b{background:hsl(var(--h) var(--ss) var(--sl));color:hsl(var(--h) var(--txs) var(--txl));padding:4px 8px 10px}
.sg{margin-top:4px}
.sg-h{display:flex;align-items:center;gap:6px;width:100%;min-height:40px;padding:0 6px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;font:600 14px/1 var(--font-d);text-transform:uppercase;letter-spacing:.08em}
.sg-h svg{width:15px;height:15px;flex:none}
.sg-h[aria-expanded="false"] svg{transform:rotate(-90deg)}
.sg-h span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-h small{font:600 12px var(--font-b);opacity:.7}
.rows{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.rw{display:flex;align-items:stretch;gap:6px;min-height:58px;border-radius:6px;background:hsl(var(--h) var(--ts) var(--tl))}
.rw[draggable="true"]{cursor:grab}
.rw-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 4px 8px 12px;border:0;background:none;color:inherit;text-align:left;cursor:pointer}
.rw-main b{font-weight:600;font-size:15.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-main span{font-size:12.5px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa{align-self:center;flex:none;display:inline-flex;align-items:center;gap:6px;min-height:42px;margin-right:8px;padding:0 13px;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13.5px;text-decoration:none}
.wa:hover{filter:brightness(1.15)}
.empty{margin:8px 8px 4px;font-size:14px;opacity:.8}
.empty-all{margin:14px 4px;text-align:center;color:var(--mut)}

#movebar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:8px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
#movebar b{font:600 13px var(--font-d);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
#movebar [data-cat]{padding:6px 12px;border-radius:5px;border:2px solid transparent;background:hsl(var(--h) 45% 82%);color:#141A22;font-weight:600;font-size:13px}
#movebar [data-cat].over{border-color:var(--ac);transform:scale(1.04)}

#overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,19,.58);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:580px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);padding:18px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){#overlay{align-items:center;padding:20px}#sheet{border-radius:12px}}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-head h2{margin:0;font:700 28px/1.05 var(--font-d);text-transform:uppercase;letter-spacing:.03em}
.sh-head p{margin:4px 0 0}
.x{width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:20px;line-height:1;cursor:pointer;flex:none}
.x.sm{width:32px;height:32px;font-size:18px}
.x:disabled{opacity:.35;cursor:not-allowed}
#sheet h3{margin:20px 0 8px;font:600 14px/1 var(--font-d);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.telrow{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin:14px 0 10px}
.telrow .telbig{margin:0;font-size:clamp(20px,5.6vw,24px);white-space:nowrap}
.telrow .btn{white-space:nowrap;flex:none}
.telbig{font:600 24px/1.1 var(--font-b);font-variant-numeric:tabular-nums;margin:14px 0 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 110px}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label{font-size:13px;color:var(--mut);font-weight:500}
.field input,.field select{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chipbtn[aria-pressed="true"],.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipbtn[data-h]{border-left:6px solid hsl(var(--h) 60% 55%)}
.hint{margin:8px 0 0;font-size:13px;color:var(--ok)}
.pps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pp{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pp-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pp-top strong{font-weight:600}
.pp .mv{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pp .mv small{color:var(--mut);margin-right:2px}
.pp-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.pp-foot button{border:0;background:none;color:var(--danger);cursor:pointer;padding:4px 0;font-size:13px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row2 .btn{flex:1 1 130px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.li{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.li input{flex:1}
.li .n{width:24px;text-align:right;font-size:12px}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:min(92vw,520px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.ac-h svg,.sg-h svg{transition:transform .15s}#movebar [data-cat]{transition:transform .1s}}

body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#movebar{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:block;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{display:flex;width:100%;max-width:640px;margin:0 auto;gap:0;padding:4px 6px}
.dk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;border-radius:12px;background:none;color:var(--mut);font:600 11.5px/1 var(--font-b);cursor:pointer;position:relative}
.dk svg{width:22px;height:22px}
.dk[aria-pressed="true"]{color:var(--ink);background:hsl(44 90% 50% / .16)}
.dk[aria-pressed="true"] svg{color:var(--ac)}
.dk.err::after{content:"";position:absolute;top:8px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--danger)}
.rw-main b .st{color:var(--ac);margin-right:4px}
@media (prefers-reduced-motion:no-preference){.dk{transition:background .15s,color .15s}}

.btn{min-height:44px}.btn.sm{min-height:44px}
.tools input,.tools select,.field input,.field select,.li input{height:44px}
.sg-h{min-height:44px}.wa{min-height:44px}
.x{width:44px;height:44px}.x.sm{width:40px;height:40px}
.chipbtn{min-height:40px;padding:8px 14px}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><h1>FlashZap</h1><span class="bsub">Business</span><span class="sub" id="stats"></span></div>
  </header>
  <div class="stripe"></div>
  <div id="banner" hidden></div>
  <section class="tools" aria-label="Filtros">
    <input id="q" type="search" placeholder="Buscar nome, empresa ou telefone" autocomplete="off" aria-label="Buscar">
    <select id="fObra" aria-label="Filtrar por obra"></select>
    <select id="fCat" aria-label="Filtrar por categoria"></select>
    <select id="fServ" aria-label="Filtrar por classificação"></select>
    <button class="btn primary" id="btnAdd">+ Novo contato</button>
  </section>
  <main class="acc" id="acc" aria-label="Contatos por categoria"></main>
  <div id="movebar" hidden></div>
</div>
<div id="overlay" hidden><div id="sheet" role="dialog" aria-modal="true" aria-label="Detalhes"></div></div>
<span id="syncChip" data-s="local" hidden><span id="syncTxt"></span></span>
<nav class="dock" aria-label="Navegação"><div class="dock-in">
  <button class="dk" id="dkHome" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Início</button>
  <button class="dk" id="dkFav" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Favoritos</button>
  <button class="dk" id="btnTheme" aria-label="Alternar tema claro e escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>Tema</button>
  <button class="dk" id="btnSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</div></nav>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var KEY='obrafonica.v1', GHKEY='obrafonica.gh', THKEY='obrafonica.tema', OBRAKEY='obrafonica.obra';
var HUES=[44,208,152,270,348,180,24,300,100,230];
var PAD=3, HEAD=24, SEMCLASS='Sem classificação';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var now=function(){return new Date().toISOString()};
var uid=function(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- dados ---------- */
function freshDb(){
  return {v:1,updatedAt:now(),exemplo:false,obras:[],
    categorias:[{id:'orc',nome:'Orçamento',h:44},{id:'emp',nome:'Empreiteiro',h:208},{id:'par',nome:'Parceiro',h:152},{id:'adm',nome:'Administração de obra',h:270},{id:'com',nome:'Compras',h:348}],
    servicos:['Eletricista','Gesseiro','Pintor','Aluguel de caçamba','Financeiro','Controle','Arquitetura'],
    contatos:[],papeis:[]};
}
function exampleDb(){
  var d=freshDb(); d.exemplo=true;
  d.obras=[{id:'oa',nome:'Obra A (exemplo)'},{id:'ob',nome:'Obra B (exemplo)'}];
  function ct(tel,nome,emp){d.contatos.push({tel:tel,nome:nome,empresa:emp})}
  function pp(tel,obra,cat,serv){d.papeis.push({id:uid(),tel:tel,obra:obra,categoria:cat,servico:serv,hist:[]})}
  ct('5511999990001','João Pereira','JP Elétrica'); pp('5511999990001','oa','emp','Eletricista'); pp('5511999990001','oa','orc','Pintor'); pp('5511999990001','ob','orc','Eletricista');
  ct('5511999990002','Marcos Lima','Gesso Lima'); pp('5511999990002','oa','emp','Gesseiro');
  ct('5511999990003','Paulo Mendes','Pinturas PM'); pp('5511999990003','ob','orc','Pintor'); pp('5511999990003','oa','orc','Pintor');
  ct('5511999990004','Rafael Dias','Caçambas Rápidas'); pp('5511999990004','oa','par','Aluguel de caçamba'); pp('5511999990004','ob','com','Aluguel de caçamba');
  ct('5511999990005','Ana Ribeiro','Studio AR'); pp('5511999990005','oa','par','Arquitetura');
  ct('5511999990006','Fernanda Alves','Escritório Central'); pp('5511999990006','oa','adm','Financeiro'); pp('5511999990006','ob','adm','Financeiro');
  ct('5511999990007','Ricardo Costa','Escritório Central'); pp('5511999990007','oa','adm','Controle');
  ct('5511999990008','Sérgio Tavares','Tavares Elétrica'); pp('5511999990008','ob','orc','Eletricista');
  return d;
}
function loadLocal(){var r=lsGet(KEY);if(r){try{var d=JSON.parse(r);if(d&&d.papeis&&d.categorias)return d}catch(e){}}return null}
var db=loadLocal()||exampleDb();
(function(){var c=function(a,b){return String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'})};db.categorias.sort(function(a,b){return c(a.nome,b.nome)});db.servicos.sort(c)})();
var ui={favs:false,q:'',obra:lsGet(OBRAKEY)||'',fcat:'',fserv:'',open:null,closed:{}};
function realObra(){return (ui.obra&&ui.obra!=='__none')?ui.obra:''}
function setObra(v){ui.obra=v;lsSet(OBRAKEY,v);render()}
var S={type:null};

function cOf(tel){return db.contatos.find(function(c){return c.tel===tel})||{tel:tel,nome:'',empresa:''}}
function catOf(id){return db.categorias.find(function(c){return c.id===id})||{id:id,nome:'(categoria removida)',h:220}}
function obraName(id){if(!id)return 'Sem obra';var o=db.obras.find(function(o){return o.id===id});return o?o.nome:'Sem obra'}
function normTel(raw){
  var d=String(raw||'').replace(/\D/g,'').replace(/^0+/,'');
  if(d.length===10||d.length===11)d='55'+d;
  if(d.indexOf('55')===0&&d.length===12&&/^[6-9]/.test(d.slice(4)))d=d.slice(0,4)+'9'+d.slice(4);
  return (d.length>=10&&d.length<=15)?d:'';
}
function fmtTel(t){
  if(t.indexOf('55')===0&&t.length===13)return '+55 ('+t.slice(2,4)+') '+t.slice(4,9)+'-'+t.slice(9);
  if(t.indexOf('55')===0&&t.length===12)return '+55 ('+t.slice(2,4)+') '+t.slice(4,8)+'-'+t.slice(8);
  return '+'+t;
}

/* ---------- gravação e sincronia ---------- */
var gh=null;try{gh=JSON.parse(lsGet(GHKEY)||'null')}catch(e){}
var sha=null,syncState=(gh&&gh.token)?'idle':'local',syncMsg='',pushTimer=null;
function ghOk(){return !!(gh&&gh.owner&&gh.repo&&gh.token)}
function setSync(s,msg){
  syncState=s;syncMsg=msg||'';
  var chip=$('#syncChip');chip.dataset.s=s;
  $('#syncTxt').textContent=s==='local'?'Só neste aparelho':s==='saving'?'Salvando…':s==='synced'?'GitHub em dia':s==='erro'?'Erro na sincronia':'GitHub';
  chip.title=msg||'';try{syncDock()}catch(e){}
}
function saveLocal(){lsSet(KEY,JSON.stringify(db))}
function sortLists(){
  var cmp=function(a,b){return String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'})};
  db.categorias.sort(function(a,b){return cmp(a.nome,b.nome)});
  db.servicos.sort(cmp);
}
function commit(rerender){
  sortLists();db.updatedAt=now();saveLocal();
  if(ghOk()){clearTimeout(pushTimer);pushTimer=setTimeout(function(){ghPush(true)},1500);setSync('saving')}
  if(rerender!==false)render();
}
function ghUrl(){
  var p=(gh.path||'contatos.json').split('/').map(encodeURIComponent).join('/');
  return 'https://api.github.com/repos/'+encodeURIComponent(gh.owner)+'/'+encodeURIComponent(gh.repo)+'/contents/'+p;
}
function hdr(){return {'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function b64enc(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)}
function b64dec(b){var s=atob(b.replace(/\s/g,''));var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new TextDecoder().decode(a)}
function netMsg(e){return (e&&e.name==='TypeError')?'Sem conexão com o GitHub (ou bloqueado neste ambiente).':(e&&e.message)||'Falha desconhecida'}
async function ghPull(){
  setSync('saving');
  try{
    var r=await fetch(ghUrl()+'?ref='+encodeURIComponent(gh.branch||'main')+'&t='+Date.now(),{headers:hdr()});
    if(r.status===404){sha=null;setSync('synced');return 'empty'}
    if(r.status===401||r.status===403)throw new Error('O token não tem permissão de leitura e escrita neste repositório.');
    if(!r.ok)throw new Error('GitHub respondeu '+r.status+'.');
    var j=await r.json();sha=j.sha;
    var remote=JSON.parse(b64dec(j.content));
    setSync('synced');return remote;
  }catch(e){setSync('erro',netMsg(e));return null}
}
async function ghPush(retry){
  if(!ghOk())return;
  setSync('saving');
  try{
    var body={message:'FlashZap Business: atualização de contatos',content:b64enc(JSON.stringify(db,null,1)),branch:gh.branch||'main'};
    if(sha)body.sha=sha;
    var h=hdr();h['Content-Type']='application/json';
    var r=await fetch(ghUrl(),{method:'PUT',headers:h,body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&retry){
      var rp=await ghPull();
      if(rp&&rp!=='empty'&&(rp.updatedAt||'')>db.updatedAt){adopt(rp);return}
      return ghPush(false);
    }
    if(r.status===401||r.status===403)throw new Error('O token não tem permissão de escrita neste repositório.');
    if(!r.ok)throw new Error('GitHub respondeu '+r.status+'.');
    var j=await r.json();sha=j.content.sha;setSync('synced');
  }catch(e){setSync('erro',netMsg(e))}
}
function adopt(remote){
  remote.exemplo=false;db=remote;
  ['obras','categorias','servicos','contatos','papeis'].forEach(function(k){if(!Array.isArray(db[k]))db[k]=[]});
  saveLocal();render();toast('Dados atualizados a partir do GitHub');
}
async function startSync(){
  if(!ghOk()){setSync('local');return}
  var r=await ghPull();
  if(r==='empty'){db.exemplo=false;commit(false);return}
  if(r){
    if((r.updatedAt||'')>(db.updatedAt||'')||db.exemplo)adopt(r);
    else if((r.updatedAt||'')<(db.updatedAt||''))ghPush(true);
  }
}

    h+='<h3>Adicionar serviço ou obra</h3>'+papelFields()+'<p class="hint" id="errAdd" style="color:var(--danger)" hidden></p><div class="row2"><button class="btn primary" data-act="save-papel">Adicionar</button><button class="btn" data-act="cancel-add">Cancelar</button></div>';
  }else h+='<div class="row2"><button class="btn" data-act="add-papel">+ Adicionar serviço ou obra</button></div>';
  h+='<div class="row2">'+(S.confirm==='c'?'<span class="confirm">Excluir este contato e todos os serviços dele? <button class="btn sm danger" data-act="rm-contact-yes">Excluir</button><button class="btn sm" data-act="rm-no">Não</button></span>':'<button class="btn danger sm" data-act="rm-contact">Excluir contato</button>')+'</div>';
  return h;
}
function usage(kind,id){
  return db.papeis.filter(function(p){return kind==='cat'?p.categoria===id:kind==='serv'?p.servico===id:p.obra===id}).length;
}
function listSection(kind,title,items){
  return '<h3>'+title+'</h3>'+items.map(function(i){
    return '<div class="li"><input aria-label="Renomear '+esc(i.label)+'" value="'+esc(i.label)+'" data-list="'+kind+'" data-id="'+esc(i.id)+'"><span class="n">'+i.used+'</span><button class="x sm" data-act="del-item" data-list="'+kind+'" data-id="'+esc(i.id)+'" aria-label="Excluir '+esc(i.label)+'"'+((i.used&&kind!=='obra')?' disabled title="Em uso"':'')+'>×</button></div>';
  }).join('')+'<div class="li"><input id="add-'+kind+'" placeholder="Adicionar…" aria-label="Novo item"><button class="btn sm" data-act="add-item" data-list="'+kind+'">Adicionar</button></div>';
}
function sheetSettings(){
  var g=gh||{};
  var h='<div class="sh-head"><div><h2>Ajustes</h2><p class="mut">Listas, sincronia com o GitHub e backup.</p></div><button class="x" data-act="close" aria-label="Fechar">×</button></div>';
  h+='<h3>GitHub (repositório privado)</h3>'+(ghOk()?'<p class="note">Sincronia: '+(syncState==='synced'?'em dia':syncState==='saving'?'salvando…':syncState==='erro'?'erro'+(syncMsg?' — '+esc(syncMsg):''):'conectado')+'</p>':'')
   +'<div class="field"><label for="g-owner">Usuário ou organização</label><input id="g-owner" value="'+esc(g.owner||'')+'" autocomplete="off"></div>'
   +'<div class="field"><label for="g-repo">Repositório</label><input id="g-repo" value="'+esc(g.repo||'')+'" autocomplete="off"></div>'
   +'<div class="field"><label for="g-branch">Branch</label><input id="g-branch" value="'+esc(g.branch||'main')+'" autocomplete="off"></div>'
   +'<div class="field"><label for="g-path">Arquivo de dados</label><input id="g-path" value="'+esc(g.path||'contatos.json')+'" autocomplete="off"></div>'
   +'<div class="field"><label for="g-token">Token de acesso</label><input id="g-token" type="password" placeholder="'+(g.token?'•••• salvo neste aparelho':'github_pat_…')+'" autocomplete="off"></div>'
   +'<p class="note">Use um token do tipo fine-grained limitado a este repositório, com permissão Contents: leitura e escrita. Ele fica guardado só neste aparelho.</p>'
   +'<p class="hint" id="errGh" style="color:var(--danger)" hidden></p>'
   +'<div class="row2"><button class="btn primary" data-act="save-gh">Salvar e sincronizar</button>'+(ghOk()?'<button class="btn" data-act="pull">Puxar do GitHub</button><button class="btn danger" data-act="off-gh">Desconectar</button>':'')+'</div>';
  h+=listSection('cat','Categorias',db.categorias.map(function(c){return {id:c.id,label:c.nome,used:usage('cat',c.id)}}));
  h+=listSection('serv','Classificações',db.servicos.map(function(s){return {id:s,label:s,used:usage('serv',s)}}));
  h+=listSection('obra','Obras',db.obras.map(function(o){return {id:o.id,label:o.nome,used:usage('obra',o.id)}}));
  if(S.confirmObra){
    var ob=db.obras.find(function(x){return x.id===S.confirmObra});
    if(ob){
      var tt={};db.papeis.forEach(function(p){if(p.obra===ob.id)tt[p.tel]=1});
      h+='<div class="pp" style="margin-top:10px;border-color:var(--danger)"><strong>Excluir “'+esc(ob.nome)+'”?</strong><span class="mut">Ela tem '+usage('obra',ob.id)+' serviço(s) de '+Object.keys(tt).length+' contato(s). O que fazer com eles?</span>'
       +'<div class="row2" style="margin-top:0"><button class="btn danger" data-act="obra-del-all">Excluir a obra e os serviços dela</button><button class="btn" data-act="obra-del-keep">Excluir a obra e manter os contatos em “Sem obra”</button><button class="btn" data-act="obra-del-no">Cancelar</button></div></div>';
    }
  }
  h+='<h3>Backup</h3><div class="row2" style="margin-top:0"><button class="btn" data-act="export">Baixar JSON</button><button class="btn" data-act="copyjson">Copiar JSON</button><button class="btn" data-act="import">Importar JSON</button></div><input type="file" id="imp" accept="application/json,.json" hidden>';
  if(S.pendingImport)h+='<p class="confirm" style="margin-top:10px">Substituir os '+db.contatos.length+' contatos atuais por '+S.pendingImport.contatos.length+' do arquivo? <button class="btn sm danger" data-act="import-yes">Substituir</button><button class="btn sm" data-act="import-no">Cancelar</button></p>';
  return h;
}
function openContact(tel){S={type:'contact',tel:tel,adding:false,editing:false,confirm:null};openSheet()}

/* ---------- eventos ---------- */
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2600)}
overlay.addEventListener('click',function(e){if(e.target===overlay)closeSheet()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!overlay.hidden)closeSheet();
});
acc.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='cat'){
    ui.open=ui.open===el.dataset.cat?null:el.dataset.cat;renderList();
    var hd=acc.querySelector('.ac.open .ac-h');if(ui.open&&hd)hd.scrollIntoView({block:'nearest'});
  }else if(a==='sv'){ui.closed[el.dataset.key]=!ui.closed[el.dataset.key];renderList()}
  else if(a==='row'){var p=db.papeis.find(function(x){return x.id===el.dataset.id});if(p)openContact(p.tel)}
});
$('#banner').addEventListener('click',function(e){
  if(e.target.closest('[data-act="clear-ex"]'))clearExamples();
});
function dropExamples(){db.contatos=[];db.papeis=[];db.obras=db.obras.filter(function(o){return o.id!=='oa'&&o.id!=='ob'});db.exemplo=false;if(ui.obra&&!db.obras.some(function(o){return o.id===ui.obra}))ui.obra=''}
function clearExamples(){dropExamples();commit();toast('Exemplos apagados')}
$('#q').addEventListener('input',function(e){ui.q=e.target.value;renderList()});
$('#fObra').addEventListener('change',function(e){
  if(e.target.value==='__newobra'){e.target.value=ui.obra;S={type:'obra'};openSheet();return}
  setObra(e.target.value);
});
$('#fCat').addEventListener('change',function(e){ui.fcat=e.target.value;if(ui.fcat)ui.open=ui.fcat;renderList()});
$('#fServ').addEventListener('change',function(e){ui.fserv=e.target.value;renderList()});

function syncDock(){$('#dkHome').setAttribute('aria-pressed',String(!ui.favs));$('#dkFav').setAttribute('aria-pressed',String(!!ui.favs));$('#btnSettings').classList.toggle('err',syncState==='erro')}
$('#dkHome').addEventListener('click',function(){ui.favs=false;render();syncDock();window.scrollTo({top:0,behavior:'smooth'})});
$('#dkFav').addEventListener('click',function(){ui.favs=!ui.favs;render();syncDock();window.scrollTo({top:0,behavior:'smooth'});if(ui.favs&&!db.contatos.some(function(c){return c.fav}))toast('Nenhum favorito ainda. Abra um contato e toque em Favoritar.')});
$('#btnAdd').addEventListener('click',function(){S={type:'new'};openSheet()});
$('#btnSettings').addEventListener('click',function(){S={type:'settings'};openSheet()});
$('#btnTheme').addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(dark?'light':'dark');lsSet(THKEY,dark?'light':'dark');
});
function applyTheme(t){if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}

/* arrastar e soltar (computador) */
var dragId=null,mb=$('#movebar');
acc.addEventListener('dragstart',function(e){
  var t=e.target.closest&&e.target.closest('.rw');if(!t)return;
  dragId=t.dataset.id;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';mb.hidden=false;
});
acc.addEventListener('dragend',function(){dragId=null;mb.hidden=true;Array.prototype.forEach.call(mb.querySelectorAll('.over'),function(n){n.classList.remove('over')})});
mb.addEventListener('dragover',function(e){var b=e.target.closest('[data-cat]');if(!b)return;e.preventDefault();Array.prototype.forEach.call(mb.querySelectorAll('.over'),function(n){n.classList.remove('over')});b.classList.add('over')});
mb.addEventListener('drop',function(e){var b=e.target.closest('[data-cat]');if(!b||!dragId)return;e.preventDefault();var id=dragId;dragId=null;mb.hidden=true;movePapel(id,b.dataset.cat)});

/* ações dentro das janelas */
sheet.addEventListener('input',function(e){
  if(e.target.id==='f-tel'){
    var tel=normTel(e.target.value),h=$('#dupHint'),c=tel&&db.contatos.find(function(x){return x.tel===tel});
    if(c){h.hidden=false;h.textContent='Já está na agenda como '+(c.nome||fmtTel(c.tel))+'. O que você marcar abaixo será somado a esse contato.';
      if(!$('#f-nome').value)$('#f-nome').value=c.nome;if(!$('#f-emp').value)$('#f-emp').value=c.empresa}
    else h.hidden=true;
  }
});
sheet.addEventListener('keydown',function(e){if(e.key!=='Enter')return;if(e.target.id==='o-nome'){e.preventDefault();saveObra()}if(e.target.id==='mv-new'){e.preventDefault();moveNew(S.newCatFor)}});
sheet.addEventListener('input',function(e){if(e.target.id==='f-cat-new'&&e.target.value.trim())Array.prototype.forEach.call(sheet.querySelectorAll('#f-cats .chipbtn'),function(b){b.setAttribute('aria-pressed','false')})});
sheet.addEventListener('change',function(e){
  if(e.target.id==='f-obra'){var nn=$('#f-obra-new');nn.hidden=e.target.value!=='__new';if(!nn.hidden)nn.focus()}
  var i=e.target.closest&&e.target.closest('input[data-list]');
  if(i)renameItem(i.dataset.list,i.dataset.id,i.value.trim(),i);
  if(e.target.id==='imp'&&e.target.files[0]){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(!d||!Array.isArray(d.papeis)||!Array.isArray(d.contatos)||!Array.isArray(d.categorias))throw new Error('x');
        S.pendingImport=d;refreshSheet();
      }catch(err){toast('Arquivo inválido: não parece um backup do FlashZap Business')}
    };
    rd.readAsText(e.target.files[0]);
  }
});
function renameItem(kind,id,val,inp){
  if(!val){inp.value=inp.defaultValue;return}
  if(kind==='cat'){var c=db.categorias.find(function(x){return x.id===id});if(c)c.nome=val}
  else if(kind==='obra'){var o=db.obras.find(function(x){return x.id===id});if(o)o.nome=val}
  else{
    if(db.servicos.some(function(s){return s!==id&&s.toLowerCase()===val.toLowerCase()})){toast('Já existe uma classificação com esse nome');inp.value=id;return}
    db.servicos=db.servicos.map(function(s){return s===id?val:s});
    db.papeis.forEach(function(p){if(p.servico===id)p.servico=val});
    inp.dataset.id=val;
  }
  commit(false);renderChrome();renderList();
}
sheet.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='close')closeSheet();
  else if(a==='pickcat'){Array.prototype.forEach.call(sheet.querySelectorAll('#f-cats .chipbtn'),function(b){b.setAttribute('aria-pressed',String(b===el))});var cn=$('#f-cat-new');if(cn)cn.value=''}
  else if(a==='tog')el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')==='true'?'false':'true');
  else if(a==='move'){movePapel(id,el.dataset.cat)}
  else if(a==='move-new'){S.newCatFor=id;refreshSheet();var mi=$('#mv-new');if(mi)mi.focus()}
  else if(a==='move-new-no'){S.newCatFor=null;refreshSheet()}
  else if(a==='move-new-ok')moveNew(id);
  else if(a==='edit'){S.editing=true;refreshSheet()}
  else if(a==='cancel-edit'){S.editing=false;refreshSheet()}
  else if(a==='copytel'){copy(fmtTel(S.tel))}
  else if(a==='fav'){var cc=db.contatos.find(function(x){return x.tel===S.tel});if(cc){if(cc.fav)delete cc.fav;else cc.fav=true;commit()}}
  else if(a==='add-papel'){S.adding=true;refreshSheet()}
  else if(a==='cancel-add'){S.adding=false;refreshSheet()}
  else if(a==='rm-papel'){S.confirm='p:'+id;refreshSheet()}
  else if(a==='rm-contact'){S.confirm='c';refreshSheet()}
  else if(a==='rm-no'){S.confirm=null;refreshSheet()}
  else if(a==='rm-papel-yes'){db.papeis=db.papeis.filter(function(p){return p.id!==id});S.confirm=null;
    if(!db.papeis.some(function(p){return p.tel===S.tel})){db.contatos=db.contatos.filter(function(c){return c.tel!==S.tel});closeSheet()}
    commit();toast('Serviço removido')}
  else if(a==='rm-contact-yes'){db.papeis=db.papeis.filter(function(p){return p.tel!==S.tel});db.contatos=db.contatos.filter(function(c){return c.tel!==S.tel});closeSheet();commit();toast('Contato excluído')}
  else if(a==='save-new')saveNew();
  else if(a==='save-obra')saveObra();
  else if(a==='save-papel'){
    var f=readPapelFields();if(f.catMissing)return showErr('#errAdd','Escolha ou digite uma categoria.');if(!f.servs.length)return showErr('#errAdd','Escolha ou digite ao menos uma classificação.');
    addPapeis(S.tel,f);S.adding=false;commit();toast('Adicionado')}
  else if(a==='save-edit')saveEdit();
  else if(a==='save-gh')saveGh();
  else if(a==='off-gh'){gh=null;try{localStorage.removeItem(GHKEY)}catch(x){}sha=null;setSync('local');refreshSheet();toast('Sincronia desligada. Os dados continuam neste aparelho.')}
  else if(a==='pull'){ghPull().then(function(r){if(r&&r!=='empty'){adopt(r)}else if(r==='empty')toast('Ainda não há arquivo no GitHub');refreshSheet()})}
  else if(a==='add-item')addItem(el.dataset.list);
  else if(a==='del-item')delItem(el.dataset.list,id);
  else if(a==='obra-del-all')removeObra(S.confirmObra,'all');
  else if(a==='obra-del-keep')removeObra(S.confirmObra,'keep');
  else if(a==='obra-del-no'){S.confirmObra=null;refreshSheet()}
  else if(a==='export')exportJson();
  else if(a==='copyjson')copy(JSON.stringify(db,null,1));
  else if(a==='import')$('#imp').click();
  else if(a==='import-yes'){var d=S.pendingImport;['obras','categorias','servicos','contatos','papeis'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[]});d.exemplo=false;db=d;S.pendingImport=null;commit();toast('Backup importado')}
  else if(a==='import-no'){S.pendingImport=null;refreshSheet()}
});
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Copiado')},function(){legacyCopy(t)});
  else legacyCopy(t);
}
function legacyCopy(t){try{var x=document.createElement('textarea');x.value=t;x.setAttribute('readonly','');x.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(x);x.select();x.setSelectionRange(0,999);var ok=document.execCommand('copy');x.remove();toast(ok?'Copiado':'Não foi possível copiar neste ambiente')}catch(e){toast('Não foi possível copiar neste ambiente')}}
function exportJson(){
  try{
    var blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='flashzap-business-'+now().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  }catch(e){toast('Não foi possível baixar aqui. Use “Copiar JSON”.')}
}
function showErr(id,msg){var n=$(id);if(n){n.textContent=msg;n.hidden=false;n.style.color='var(--danger)'}}
function saveNew(){
  var tel=normTel($('#f-tel').value);
  if(!tel)return showErr('#errNew','Digite um telefone válido, com DDD.');
  var nome=$('#f-nome').value.trim(),emp=$('#f-emp').value.trim(),f=readPapelFields();
  if(!nome&&!db.contatos.some(function(c){return c.tel===tel}))return showErr('#errNew','Digite o nome do contato.');
  if(f.catMissing)return showErr('#errNew','Escolha ou digite uma categoria.');
  if(!f.servs.length)return showErr('#errNew','Escolha ou digite ao menos uma classificação.');
  if(db.exemplo&&!S.okEx){S.okEx=true;showErr('#errNew','Os contatos de exemplo serão apagados ao salvar seu primeiro contato. Toque em Salvar contato de novo para confirmar.');$('#errNew').style.color='var(--ink)';return}
  if(db.exemplo){dropExamples();toast('Exemplos removidos')}
  var c=db.contatos.find(function(x){return x.tel===tel});
  if(c){if(nome)c.nome=nome;if(emp)c.empresa=emp}else db.contatos.push({tel:tel,nome:nome,empresa:emp});
  addPapeis(tel,f);
  if(f.obra){ui.obra=ensureObra(f.obra);lsSet(OBRAKEY,ui.obra)}
  S={type:'contact',tel:tel,adding:false,editing:false,confirm:null};
  commit();
}
function saveEdit(){
  var tel=normTel($('#e-tel').value);
  if(!tel)return showErr('#errEdit','Telefone inválido.');
  if(tel!==S.tel&&db.contatos.some(function(c){return c.tel===tel}))return showErr('#errEdit','Esse número já pertence a outro contato.');
  var c=db.contatos.find(function(x){return x.tel===S.tel});
  c.nome=$('#e-nome').value.trim();c.empresa=$('#e-emp').value.trim();
  if(tel!==S.tel){db.papeis.forEach(function(p){if(p.tel===S.tel)p.tel=tel});c.tel=tel;S.tel=tel}
  S.editing=false;commit();
}
function saveGh(){
  var o=$('#g-owner').value.trim(),r=$('#g-repo').value.trim(),t=$('#g-token').value.trim()||(gh&&gh.token)||'';
  if(!o||!r||!t)return showErr('#errGh','Preencha usuário, repositório e token.');
  gh={owner:o,repo:r,branch:$('#g-branch').value.trim()||'main',path:$('#g-path').value.trim()||'contatos.json',token:t};
  lsSet(GHKEY,JSON.stringify(gh));sha=null;
  startSync().then(function(){if(S.type==='settings')refreshSheet();toast(syncState==='erro'?'Não sincronizou: '+syncMsg:'Sincronizado com o GitHub')});
}
function addItem(kind){
  var inp=$('#add-'+kind),v=inp.value.trim();if(!v)return;
  if(kind==='cat'){
    if(db.categorias.some(function(c){return c.nome.toLowerCase()===v.toLowerCase()}))return toast('Essa categoria já existe');
    db.categorias.push({id:uid(),nome:v,h:nextHue()});
  }else if(kind==='serv'){
    if(db.servicos.some(function(s){return s.toLowerCase()===v.toLowerCase()}))return toast('Essa classificação já existe');
    db.servicos.push(v);
  }else{
    if(db.obras.some(function(o){return o.nome.toLowerCase()===v.toLowerCase()}))return toast('Essa obra já existe');
    db.obras.push({id:uid(),nome:v});
  }
  commit();
}
function removeObra(id,mode){
  if(mode==='all'){
    var tels={};db.papeis.forEach(function(p){if(p.obra===id)tels[p.tel]=1});
    db.papeis=db.papeis.filter(function(p){return p.obra!==id});
    db.contatos=db.contatos.filter(function(c){return !tels[c.tel]||db.papeis.some(function(p){return p.tel===c.tel})});
  }else{
    db.papeis.forEach(function(p){if(p.obra===id)p.obra=''});
    var seen={};db.papeis=db.papeis.filter(function(p){var k=[p.tel,p.obra,p.servico,p.categoria].join('|');if(seen[k])return false;seen[k]=1;return true});
  }
  db.obras=db.obras.filter(function(o){return o.id!==id});
  if(ui.obra===id){ui.obra='';lsSet(OBRAKEY,'')}
  S.confirmObra=null;commit();toast('Obra excluída');
}
function delItem(kind,id){
  if(kind==='obra'&&usage('obra',id)){S.confirmObra=id;refreshSheet();var cp=sheet.querySelector('.pp[style*="danger"]');if(cp)cp.scrollIntoView({block:'center'});return}
  if(usage(kind,id))return;
  if(kind==='cat')db.categorias=db.categorias.filter(function(c){return c.id!==id});
  else if(kind==='serv')db.servicos=db.servicos.filter(function(s){return s!==id});
  else db.obras=db.obras.filter(function(o){return o.id!==id});
  commit();
}

/* ---------- início ---------- */
applyTheme(lsGet(THKEY));
setSync(syncState==='idle'?'idle':'local');
render();
if(ghOk())startSync();
syncDock();
window.__obra={get db(){return db}};
})();
</script>
